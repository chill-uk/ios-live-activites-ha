alias: Dryer - Clear iPhone Live Activity
description: Clears the dryer Live Activity 15 minutes after completion
triggers:
  - trigger: state
    entity_id: sensor.samsung_dryer_da_wm_tp1_21_common_progress
    to: finish
actions:
  - delay: '00:15:00'
  - action: notify.mobile_app_iphone
    data:
      message: clear_notification
      data:
        tag: dryer_cycle
mode: restart
